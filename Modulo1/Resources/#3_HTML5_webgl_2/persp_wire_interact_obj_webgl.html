<!doctype html>
<html>
  <head>
      <!--per ricaricare sempre la pagina da zero e non usare la cache-->
      <META HTTP-EQUIV=”Pragma” CONTENT=”no-cache”>
      <META HTTP-EQUIV=”Cache-Control” CONTENT=”no-cache”>
      <!--per definire la dimensione e posizione dell'elemento canvas;
        se i valori di width ed height impostati qui sono superiori a
        corrispondenti settati in <canvas width= .. height=.. l'immagine
        verra' adattata ingrandendola, mentre se i valori sono inferiori,
        l'iimagine verra' adattata rimpicciolendola-->
      <style>
        body {
            background: #dddddd;
        }
        #my_Canvas {
            margin: 10px;
            padding: 5px;
            background: #ffffff;
            border: thin inset #aaaaaa;
        }
    </style>
   </head>

<h1>WebGL: OBJ (minimal)</h1>
<p>
<input type="file" id="objInput" accept=".obj">
<button id="loadBtn">Carica e renderizza</button>
</p>
<p>
<button id = "Button1">Increase FOV</button>
<button id = "Button2">Decrease FOV</button>
<button id = "Button3">Increase D</button>
<button id = "Button4">Decrease D</button>
</p>
<p>
<button id = "Button5">Increase theta</button>
<button id = "Button6">Decrease theta</button>
<button id = "Button7">Increase phi</button>
<button id = "Button8">Decrease phi</button>
</p>

<body>

<script src="resources/m4.js"></script>

<canvas width="500" height="500" id="my_Canvas"></canvas>
<!-- <canvas id="my_Canvas" width="500" height="500" style="border:1px solid #d3d3d3;top: 80px; left: 80px; position: absolute;"></canvas>-->

<script>
/*============= Creating a canvas ======================*/ 
var canvas = document.getElementById('my_Canvas');
gl = canvas.getContext('experimental-webgl');

/*=================== SHADERS =================== */
var vertCode='attribute vec3 position;'+
'uniform mat4 Pmatrix;'+ 
'uniform mat4 Vmatrix;'+
'void main(void) { '+
'gl_Position = Pmatrix*Vmatrix*vec4(position, 1.);'+ 
'}';
var fragCode='precision mediump float;'+ 
'void main(void) {'+
'gl_FragColor = vec4(0., 0., 1., 1.);'+ 
'}';

var vertShader = gl.createShader(gl.VERTEX_SHADER); 
gl.shaderSource(vertShader, vertCode); 
gl.compileShader(vertShader);

var fragShader = gl.createShader(gl.FRAGMENT_SHADER); 
gl.shaderSource(fragShader, fragCode); 
gl.compileShader(fragShader);

var shaderprogram=gl.createProgram(); 
gl.attachShader(shaderprogram, vertShader); 
gl.attachShader(shaderprogram, fragShader);
gl.linkProgram(shaderprogram);

var _Pmatrix = gl.getUniformLocation(shaderprogram, "Pmatrix"); 
var _Vmatrix = gl.getUniformLocation(shaderprogram, "Vmatrix"); 
const posLoc = gl.getAttribLocation(shaderprogram, 'position');

gl.useProgram(shaderprogram); 

//set global variables
var materials={};
var mesh={};
var changeV=1, changeP=1;
var teta, fi, D;
var r, s, alpha;
var view_matrix, proj_matrix;
var vertices= [];
var indices = [];

//incrementi per alpha, teta e fi
var salpha=0.025; 
var dr = 2.4 * Math.PI/180.0;

/* =======================
   Utility file reader
======================= */
function readFile(file) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.readAsText(file);
  });
}

/* =======================
   Parsers
======================= */
function parseOBJ(text) {
  const vertices = [];
  const faces = [];

  text.split('\n').forEach(l => {
    l = l.trim();
    if (!l || l.startsWith('#')) return;
    const p = l.split(/\s+/);

    if (p[0] === 'v') {
      vertices.push(p.slice(1).map(Number));
    } else if (p[0] === 'f') {
      faces.push(p.slice(1).map(Number));
    }
  });

  return { vertices, faces };
}

function degToRad(d) {
    return d * Math.PI / 180;
}

var mouseDown=function(e) {
    drag=true;
    old_x=e.pageX, old_y=e.pageY;
    e.preventDefault();
    return false;
};

var mouseUp=function(e){
    drag=false;
};

var mouseMove=function(e) {
   if (!drag) return false; 
   dX=(e.pageX-old_x)*2*Math.PI/canvas.width, 
   dY=(e.pageY-old_y)*2*Math.PI/canvas.height; 
   teta+=dX;
   fi+=dY;
   old_x=e.pageX, old_y=e.pageY; 
   e.preventDefault();
   changeV=1;
};

function mouseWheel(e){
  if (e.deltaY < 0)
    D += 0.2;
 else if (e.deltaY > 0)
    D -= 0.2;
 changeV=1;
}

function getWireframeIndices(faces) {
    const edges = new Set();
    const ind = [];

    faces.forEach(face => {
        // Una faccia è un array di indici, es: [v1, v2, v3]
        for (let i = 0; i < face.length; i++) {
            let v1 = face[i]-1;
            let v2 = face[(i + 1) % face.length]-1; // Collega l'ultimo al primo

            // Crea una chiave univoca per l'arco (es: "10-25")
            // Ordinando i numeri evitiamo duplicati (10-25 è uguale a 25-10)
            const edgeKey = v1 < v2 ? `${v1}-${v2}` : `${v2}-${v1}`;

            if (!edges.has(edgeKey)) {
                edges.add(edgeKey);
                ind.push(v1, v2);
            }
        }
    });

    return new Uint16Array(ind);
}

function unitize(vert) {
    var maxx, minx, maxy, miny, maxz, minz;
    var w, h, d;
    var cx, cy, cz, scale;

    // get the max/mins 
    maxx = minx = vert[0];
    maxy = miny = vert[1];
    maxz = minz = vert[2];
    for (var i = 3; i < vert.length; i=i+3) {
        if (maxx < vert[i])
            maxx = vert[i];
        if (minx > vert[i])
            minx = vert[i];
        
        if (maxy < vert[i+1])
            maxy = vert[i+1];
        if (miny > vert[i+1])
            miny = vert[i+1];
        
        if (maxz < vert[i+2])
            maxz = vert[i+2];
        if (minz > vert[i+2])
            minz = vert[i+2];
    }
    
    //calculate model width, height, and depth 
    w = maxx - minx;
    h = maxy - miny;
    d = maxz - minz;
    
    // calculate center of the model 
    cx = (maxx + minx) / 2.0;
    cy = (maxy + miny) / 2.0;
    cz = (maxz + minz) / 2.0;
    
    // calculate unitizing scale factor 
    scale = 2.0 / Math.max(Math.max(w, h), d);
    
    // translate around center then scale 
    for (i = 0; i < vert.length; i=i+3) {
        vert[i] -= (cx);
        vert[i+1] -= (cy);
        vert[i+2] -= (cz);
        vert[i] *= (scale);
        vert[i+1] *= (scale);
        vert[i+2] *= (scale);
    }

    // return {
	// scale: scale,
	// cx: cx,
	// cy: cy,
	// cz: cz,
    // }
}

function render(gl, mesh) {
    teta=degToRad(20), fi=degToRad(60), D=5;
    r=Math.sqrt(3);
    s=r*D/Math.sqrt(Math.pow(D,2)-Math.pow(r,2));
    alpha=2*Math.atan(s/D);

    vertices = new Float32Array(mesh.vertices.flat());
    indices = getWireframeIndices(mesh.faces);
    console.log(vertices);
    unitize(vertices);


    console.log(vertices);
    // console.log(indices);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);

    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

    // Create and store data into index buffer
    const index_buffer= gl.createBuffer (); 
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, index_buffer); 
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW); 
}

/*=================== Drawing =================== */
var animate=function(time) {

 if (changeP){
 // Compute the projection matrix with near and far plane
  proj_matrix = m4.perspective(alpha, canvas.width/canvas.height, 0.25, 200);
  changeP=0;
 }

 if (changeV){
  steta=Math.sin(teta);
  cteta=Math.cos(teta);
  sfi=Math.sin(fi);
  cfi=Math.cos(fi);
  var cameraPosition = [D*sfi*cteta, D*sfi*steta, D*cfi];
  var up = [0, 0, 1];
  var target = [0, 0, 0];
 // Compute the camera's matrix using look at.
  view_matrix = m4.lookAt(cameraPosition, target, up);
 // Make a view matrix from the camera matrix.
  view_matrix = m4.inverse(view_matrix);
  changeV=0;
 }

 gl.uniformMatrix4fv(_Pmatrix, false, proj_matrix); 
 gl.uniformMatrix4fv(_Vmatrix, false, view_matrix); 

 gl.enable(gl.DEPTH_TEST);
 // gl.depthFunc(gl.LEQUAL); 
 gl.clearColor(0.75, 0.75, 0.75, 1); 
 gl.clearDepth(1.0);
 gl.viewport(0.0, 0.0, canvas.width, canvas.height); 
 gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

 gl.drawElements(gl.LINES, indices.length, gl.UNSIGNED_SHORT, 0);

 window.requestAnimationFrame(animate); 
}

//call back functions
document.getElementById("Button1").onclick = function(){alpha += salpha; changeP=1;};
document.getElementById("Button2").onclick = function(){alpha -= salpha; changeP=1;};
document.getElementById("Button3").onclick = function(){D *= 1.1; changeV=1;};
document.getElementById("Button4").onclick = function(){D *= 0.9; changeV=1;};
document.getElementById("Button5").onclick = function(){teta += dr; changeV=1;};
document.getElementById("Button6").onclick = function(){teta -= dr; changeV=1;};
document.getElementById("Button7").onclick = function(){fi += dr; changeV=1;};
document.getElementById("Button8").onclick = function(){fi -= dr; changeV=1;};

var drag=false;
var old_x, old_y;
var dX=0, dY=0;

canvas.addEventListener("mousedown", mouseDown, false); 
canvas.addEventListener("mouseup", mouseUp, false); 
canvas.addEventListener("mouseout", mouseUp, false); 
canvas.addEventListener("mousemove", mouseMove, false);
canvas.addEventListener("wheel", mouseWheel, false);

document.getElementById('loadBtn').onclick = async () => {
  const objFile = document.getElementById('objInput').files[0];
  if (!objFile) return alert('Carica OBJ');

  const [objText] = await Promise.all([
    readFile(objFile)
  ]);

  mesh = parseOBJ(objText);

  render(gl, mesh);
  animate(0);
};

</script>
</body>
</html>
